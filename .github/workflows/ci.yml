name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: agentguard, POSTGRES_PASSWORD: agentguard, POSTGRES_DB: agentguard_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U agentguard" --health-interval 3s --health-retries 20
    defaults:
      run: {working-directory: backend}
    env:
      AG_SIGNING_SECRET: ci-only-signing-secret
      AG_WEBHOOK_SECRET: ci-only-webhook-secret
      AG_DATABASE_URL: postgresql+psycopg://agentguard:agentguard@localhost:5432/agentguard_test
      AG_TEST_DATABASE_URL: postgresql+psycopg://agentguard:agentguard@localhost:5432/agentguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: Tests on PostgreSQL (includes concurrency tests)
        run: pytest
      - name: Tests on SQLite
        run: AG_TEST_DATABASE_URL=sqlite:///./test.db pytest

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentguard-api ./backend
